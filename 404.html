<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Not found — Brazilian Zouk Munich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f4efe6;--dim:#a89f92;--ground:#0d0b0a;--gold:#e2c98a;--line:#2a2521}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-content:center;text-align:center;
    padding:2rem;gap:.4rem;background:var(--ground);color:var(--ink);
    font:300 1rem/1.6 Jost,system-ui,sans-serif;
  }
  h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.05}
  h1 em{display:block;font-style:italic;color:var(--gold)}
  p{margin:1.2rem auto 0;max-width:34ch;color:var(--dim)}
  a{
    display:inline-block;margin-top:2rem;padding:.75rem 1.6rem;color:var(--ink);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;
    transition:border-color .3s ease;
  }
  a:hover,a:focus-visible{border-color:var(--gold)}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
  <h1>Nothing here<em>yet</em></h1>
  <p>That page doesn't exist. The five designs are all on the main page.</p>
  <a href="/vedant-zouk/">Back to the designs</a>
</body>
</html>
